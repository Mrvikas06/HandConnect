<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandConnect — AR Hand Tracker</title>
    
    <meta name="description" content="HandConnect - Real-time browser-based AR hand tracker with interactive visual and audio effects.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div id="startOverlay">
        <canvas id="entryParticles"></canvas>
        <div class="overlay-content">
            <div class="overlay-icon">🖐️</div>
            <h1 class="overlay-title">HANDCONNECT</h1>
            <p class="overlay-tagline">Your hands are the controller. The world is your canvas.</p>
            <div class="overlay-features">
                <span class="feature-pill">🕸️ String Web</span>
                <span class="feature-pill">🎨 5 Themes</span>
                <span class="feature-pill">🔊 Reactive Audio</span>
                <span class="feature-pill">🎆 Particles</span>
                <span class="feature-pill">🟢 Matrix Rain</span>
            </div>
            <button class="start-btn" id="startBtn">Enter Experience</button>
            <p class="overlay-hint">Requires camera access · Works best in Chrome</p>
        </div>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Spread: <span class="val" id="ui-spread">0%</span></div>
        </div>
    </div>

    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">Rainbow</button>
        <button class="theme-btn" data-theme="Cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="Lava">Lava</button>
        <button class="theme-btn" data-theme="Ocean">Ocean</button>
        <button class="theme-btn" data-theme="Galaxy">Galaxy</button>
    </div>

<script>
(function initEntryParticles() {
    const epc = document.getElementById('entryParticles');
    const ectx = epc.getContext('2d');
    let ew = epc.width = window.innerWidth;
    let eh = epc.height = window.innerHeight;
    const dots = [];
    let animId;
    for (let i = 0; i < 60; i++) {
        dots.push({
            x: Math.random() * ew,
            y: Math.random() * eh,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            r: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.4 + 0.1
        });
    }
    function drawEntry() {
        ectx.clearRect(0, 0, ew, eh);
        dots.forEach(d => {
            d.x += d.vx;
            d.y += d.vy;
            if (d.x < 0) d.x = ew;
            if (d.x > ew) d.x = 0;
            if (d.y < 0) d.y = eh;
            if (d.y > eh) d.y = 0;
            ectx.beginPath();
            ectx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ectx.fillStyle = `rgba(255, 255, 255, ${d.a})`;
            ectx.fill();
        });
        for (let i = 0; i < dots.length; i++) {
            for (let j = i + 1; j < dots.length; j++) {
                const dx = dots[i].x - dots[j].x;
                const dy = dots[i].y - dots[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ectx.beginPath();
                    ectx.moveTo(dots[i].x, dots[i].y);
                    ectx.lineTo(dots[j].x, dots[j].y);
                    ectx.strokeStyle = `rgba(255, 255, 255, ${0.06 * (1 - dist / 120)})`;
                    ectx.stroke();
                }
            }
        }
        animId = requestAnimationFrame(drawEntry);
    }
    drawEntry();
    function handleEntryResize() { ew = epc.width = window.innerWidth; eh = epc.height = window.innerHeight; }
    window.addEventListener('resize', handleEntryResize);
    document.getElementById('startBtn').addEventListener('click', () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', handleEntryResize);
    }, { once: true });
})();

const videoElement = document.querySelector('.input_video');
const bgCanvas = document.getElementById('bgCanvas');
const mainCanvas = document.getElementById('mainCanvas');
const bgCtx = bgCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();

let currentHands = [];
let handVelocities = 0;

let currentTheme = 'Rainbow';
const themes = {
    'Rainbow':   (t, index, total) => `hsl(${(t * 100 + index * (360/total)) % 360}, 100%, 60%)`,
    'Cyberpunk': (t, index, total) => (index % 2 === 0) ? '#ff003c' : '#00f0ff',
    'Lava':      (t, index, total) => `hsl(${(10 + (index * 10)) % 40}, 100%, ${50 + Math.sin(t)*10}%)`,
    'Ocean':     (t, index, total) => `hsl(${180 + (index * 20)}, 100%, 60%)`,
    'Galaxy':    (t, index, total) => `hsl(${260 + Math.sin(t*2 + index)*40}, 100%, 65%)`
};

const particleSystem = new ParticleSystem(100, 25);
const FINGER_TIPS = [4, 8, 12, 16, 20];

let matrixColumns = [];
const fontSize = 16;
let maxColumns = 0;

const audioEngine = new AudioEngine();

const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiGesture = document.getElementById('ui-gesture');
const uiSpread = document.getElementById('ui-spread');

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    bgCanvas.width = width;
    bgCanvas.height = height;
    mainCanvas.width = width;
    mainCanvas.height = height;
    bgCtx.font = fontSize + "px monospace";
    maxColumns = Math.floor(width / fontSize);
    matrixColumns = new Array(maxColumns).fill(1).map(() => Math.random() * height/fontSize);
}
window.addEventListener('resize', resize);
resize();

document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTheme = e.target.getAttribute('data-theme');
        document.documentElement.style.setProperty('--accent', themes[currentTheme](0, 1, 1));
    });
});

let appStarted = false;
document.getElementById('startBtn').addEventListener('click', () => {
    if (appStarted) return;
    appStarted = true;
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('themes').classList.remove('hidden');
    audioEngine.init();
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function mapToCanvas(point) {
    return { x: point.x * width, y: point.y * height };
}

let lastPinchState = [false, false];

const HAND_CONNECTIONS_DEFAULT = [
    [0, 1], [1, 2], [2, 3], [3, 4],
    [0, 5], [5, 6], [6, 7], [7, 8],
    [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16],
    [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
];

function drawHandBones(context, landmarks, color) {
    if (typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined') {
        drawConnectors(context, landmarks, HAND_CONNECTIONS, { color: color, lineWidth: 2 });
        return;
    }
    const connections = (typeof HAND_CONNECTIONS !== 'undefined') ? HAND_CONNECTIONS : HAND_CONNECTIONS_DEFAULT;
    context.strokeStyle = color;
    context.lineWidth = 2;
    for (let i = 0; i < connections.length; i++) {
        const p1 = landmarks[connections[i][0]];
        const p2 = landmarks[connections[i][1]];
        if (p1 && p2) {
            context.beginPath();
            context.moveTo(p1.x * width, p1.y * height);
            context.lineTo(p2.x * width, p2.y * height);
            context.stroke();
        }
    }
}

function detectGestures() {
    if (!currentHands.length) {
        uiGesture.innerText = "None";
        uiSpread.innerText = "0%";
        lastPinchState = [false, false];
        return;
    }
    
    currentHands.forEach((hand, idx) => {
        if (!hand || !hand[4] || !hand[8]) return;
        const thumb = hand[4];
        const index = hand[8];
        const dist = getDist(thumb, index);
        const isPinching = dist < 0.05;
        
        if (isPinching && !lastPinchState[idx]) {
            const midpoint = {
                x: (thumb.x + index.x) / 2, 
                y: (thumb.y + index.y) / 2
            };
            particleSystem.emitShockwave(mapToCanvas(midpoint), themes[currentTheme](time, 1, 1));
            audioEngine.triggerZap();
            uiGesture.innerText = "PINCH !";
        }
        lastPinchState[idx] = isPinching;
    });

    if (currentHands[0] && currentHands[0][8] && currentHands[0][20]) {
        const spread = getDist(currentHands[0][8], currentHands[0][20]);
        let spreadPct = Math.min(Math.round(spread * 300), 100);
        uiSpread.innerText = spreadPct + '%';
        if (!lastPinchState.includes(true)) {
            uiGesture.innerText = spreadPct > 50 ? "Open Hand" : "Fist";
        }
    }
}

function drawBackground() {
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = `rgba(0, 0, 0, ${0.15 + Math.min(handVelocities*10, 0.5)})`;
    bgCtx.fillRect(0, 0, width, height);
    bgCtx.globalCompositeOperation = 'source-over';

    bgCtx.fillStyle = themes[currentTheme](time, 1, 1);
    
    let speedMult = 1 + (handVelocities * 100);

    for (let i = 0; i < matrixColumns.length; i++) {
        if (Math.random() > 0.95) {
            const char = String.fromCharCode(0x30A0 + Math.random() * 96);
            bgCtx.fillText(char, i * fontSize, matrixColumns[i] * fontSize);
        }
        matrixColumns[i] += Math.random() * speedMult;
        if (matrixColumns[i] * fontSize > height && Math.random() > 0.9) {
            matrixColumns[i] = 0;
        }
    }
}

function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        uiFps.innerText = framesThisSecond;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    drawBackground();

    ctx.clearRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'screen';

    particleSystem.updateAndRender(ctx);

    if (currentHands.length > 0) {
        
        currentHands.forEach((hand, handIndex) => {
            const glowColor = themes[currentTheme](time, handIndex, 2);
            
            drawHandBones(ctx, hand, glowColor);
            
            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt = mapToCanvas(hand[tipIndex]);
                const tipCol = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                if (Math.random() > 0.8) {
                    particleSystem.emit(pt, tipCol, 1);
                }
            });

            const spread = getDist(hand[8], hand[20]);
            if (spread > 0.08) {
                const tips = FINGER_TIPS.map(t => mapToCanvas(hand[t]));
                for (let a = 0; a < tips.length; a++) {
                    for (let b = a + 1; b < tips.length; b++) {
                        ctx.beginPath();
                        ctx.moveTo(tips[a].x, tips[a].y);
                        ctx.lineTo(tips[b].x, tips[b].y);
                        ctx.strokeStyle = themes[currentTheme](time, a + b, 10);
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = 0.6;
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
            }
        });

        if (currentHands.length >= 2) {
            const h1 = currentHands[0];
            const h2 = currentHands[1];

            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt1 = mapToCanvas(h1[tipIndex]);
                const pt2 = mapToCanvas(h2[tipIndex]);
                const col = themes[currentTheme](time, idx, FINGER_TIPS.length);

                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                ctx.strokeStyle = col;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            if (h1 && h2) {
                let allTips = FINGER_TIPS.map(t => mapToCanvas(h1[t])).concat(
                              FINGER_TIPS.map(t => mapToCanvas(h2[t])) );
                
                ctx.save();
                let cx = allTips.reduce((sum, p) => sum + p.x, 0) / 10;
                let cy = allTips.reduce((sum, p) => sum + p.y, 0) / 10;
                
                ctx.translate(cx, cy);
                ctx.rotate(time * 0.5);
                
                ctx.beginPath();
                for (let i=0; i<10; i++) {
                    const t1 = { x: allTips[i].x - cx, y: allTips[i].y - cy };
                    const t2 = { x: allTips[(i+3)%10].x - cx, y: allTips[(i+3)%10].y - cy };
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                }
                ctx.strokeStyle = `rgba(255, 255, 255, 0.2)`;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        }
        
        detectGestures();
    }
    
    ctx.globalCompositeOperation = 'source-over';
}

function showError(msg) {
    const banner = document.getElementById('errorBanner');
    if (banner) {
        banner.textContent = msg;
        banner.classList.remove('hidden');
    }
}

function initMediaPipe() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("Camera API is not supported in this environment. Please run over HTTPS or localhost.");
        return;
    }

    try {
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.4
        });

        hands.onResults((results) => {
            uiHands.innerText = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
            
            let targetVel = 0;
            if (currentHands.length > 0 && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const oldP = currentHands[0][8];
                const newP = results.multiHandLandmarks[0][8];
                if (oldP && newP) {
                    targetVel = getDist(oldP, newP);
                }
            }
            handVelocities += (targetVel - handVelocities) * 0.25;

            currentHands = results.multiHandLandmarks || [];
            audioEngine.updateHum(currentHands);
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        
        camera.start().catch((err) => {
            console.error("Camera startup failed:", err);
            showError("Unable to access camera. Please allow camera permissions and refresh.");
        });
    } catch (err) {
        console.error("MediaPipe initialization error:", err);
        showError("MediaPipe initialization failed. Please check network connection.");
    }
}

</script>
</body>
</html>
