<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandConnect — AR Hand Tracker</title>
    
    <meta name="description" content="HandConnect - Real-time browser-based AR hand tracker with interactive visual and audio effects.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/matrix.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/app.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div id="startOverlay">
        <canvas id="entryParticles"></canvas>
        <div class="overlay-content">
            <div class="overlay-icon">🖐️</div>
            <h1 class="overlay-title">HANDCONNECT</h1>
            <p class="overlay-tagline">Your hands are the controller. The world is your canvas.</p>
            <div class="overlay-features">
                <span class="feature-pill">🕸️ String Web</span>
                <span class="feature-pill">🎨 5 Themes</span>
                <span class="feature-pill">🔊 Reactive Audio</span>
                <span class="feature-pill">🎆 Particles</span>
                <span class="feature-pill">🟢 Matrix Rain</span>
            </div>
            <button class="start-btn" id="startBtn">Enter Experience</button>
            <p class="overlay-hint">Requires camera access · Works best in Chrome</p>
        </div>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Spread: <span class="val" id="ui-spread">0%</span></div>
        </div>
    </div>

    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">Rainbow</button>
        <button class="theme-btn" data-theme="Cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="Lava">Lava</button>
        <button class="theme-btn" data-theme="Ocean">Ocean</button>
        <button class="theme-btn" data-theme="Galaxy">Galaxy</button>
    </div>

</body>
</html>
