<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandConnect — AR Hand Tracker</title>
    
    <meta name="description" content="HandConnect - Real-time browser-based AR hand tracker with interactive visual and audio effects.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #050510;
            --text-color: #ffffff;
            --glass-bg: rgba(20, 25, 40, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(16px);
            --accent: #00ffcc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .video-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 0;
            filter: brightness(0.6) contrast(1.1);
        }

        #bgCanvas, #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #bgCanvas {
            z-index: 1;
            pointer-events: none;
        }

        #mainCanvas {
            z-index: 5;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            min-width: 180px;
        }
        .stat:last-child { margin-bottom: 0; }
        .stat span.val { font-weight: bold; color: var(--accent); }

        #themes {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px;
            transition: opacity 0.5s;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 500;
        }
        
        .theme-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            text-shadow: 0 0 10px white;
        }

        #startOverlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, #0d0221 0%, #0a0a1a 50%, #050510 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        #startOverlay::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 204, 0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            animation: floatOrb1 8s ease-in-out infinite;
        }

        #startOverlay::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.12) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            border-radius: 50%;
            animation: floatOrb2 10s ease-in-out infinite;
        }

        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-60px, 40px) scale(1.2); }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -30px) scale(1.1); }
        }

        #entryParticles {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .overlay-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }

        .overlay-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            animation: pulseIcon 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.5));
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .overlay-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ff00cc 0%, #00ffcc 50%, #3333ff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .overlay-tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            max-width: 460px;
        }

        .overlay-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 48px;
            max-width: 500px;
        }

        .feature-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .feature-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            transform: translateY(-2px);
        }

        .start-btn {
            position: relative;
            padding: 18px 52px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ff00cc, #7b2ffc, #3333ff);
            background-size: 200% 200%;
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            animation: btnGlow 3s ease-in-out infinite;
            z-index: 1;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff00cc, #7b2ffc, #3333ff);
            background-size: 200% 200%;
            z-index: -1;
            filter: blur(18px);
            opacity: 0.6;
            animation: btnGlow 3s ease-in-out infinite;
        }

        @keyframes btnGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .start-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(123, 47, 252, 0.6), 0 0 80px rgba(255, 0, 204, 0.3);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .overlay-hint {
            margin-top: 32px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            animation: fadeInUp 1.5s ease 0.5s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.92);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 200;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            max-width: 90vw;
            text-align: center;
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div id="startOverlay">
        <canvas id="entryParticles"></canvas>
        <div class="overlay-content">
            <div class="overlay-icon">🖐️</div>
            <h1 class="overlay-title">HANDCONNECT</h1>
            <p class="overlay-tagline">Your hands are the controller. The world is your canvas.</p>
            <div class="overlay-features">
                <span class="feature-pill">🕸️ String Web</span>
                <span class="feature-pill">🎨 5 Themes</span>
                <span class="feature-pill">🔊 Reactive Audio</span>
                <span class="feature-pill">🎆 Particles</span>
                <span class="feature-pill">🟢 Matrix Rain</span>
            </div>
            <button class="start-btn" id="startBtn">Enter Experience</button>
            <p class="overlay-hint">Requires camera access · Works best in Chrome</p>
        </div>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Spread: <span class="val" id="ui-spread">0%</span></div>
        </div>
    </div>

    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">Rainbow</button>
        <button class="theme-btn" data-theme="Cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="Lava">Lava</button>
        <button class="theme-btn" data-theme="Ocean">Ocean</button>
        <button class="theme-btn" data-theme="Galaxy">Galaxy</button>
    </div>

<script>
(function initEntryParticles() {
    const epc = document.getElementById('entryParticles');
    const ectx = epc.getContext('2d');
    let ew = epc.width = window.innerWidth;
    let eh = epc.height = window.innerHeight;
    const dots = [];
    let animId;
    for (let i = 0; i < 60; i++) {
        dots.push({
            x: Math.random() * ew,
            y: Math.random() * eh,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            r: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.4 + 0.1
        });
    }
    function drawEntry() {
        ectx.clearRect(0, 0, ew, eh);
        dots.forEach(d => {
            d.x += d.vx;
            d.y += d.vy;
            if (d.x < 0) d.x = ew;
            if (d.x > ew) d.x = 0;
            if (d.y < 0) d.y = eh;
            if (d.y > eh) d.y = 0;
            ectx.beginPath();
            ectx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ectx.fillStyle = `rgba(255, 255, 255, ${d.a})`;
            ectx.fill();
        });
        for (let i = 0; i < dots.length; i++) {
            for (let j = i + 1; j < dots.length; j++) {
                const dx = dots[i].x - dots[j].x;
                const dy = dots[i].y - dots[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ectx.beginPath();
                    ectx.moveTo(dots[i].x, dots[i].y);
                    ectx.lineTo(dots[j].x, dots[j].y);
                    ectx.strokeStyle = `rgba(255, 255, 255, ${0.06 * (1 - dist / 120)})`;
                    ectx.stroke();
                }
            }
        }
        animId = requestAnimationFrame(drawEntry);
    }
    drawEntry();
    function handleEntryResize() { ew = epc.width = window.innerWidth; eh = epc.height = window.innerHeight; }
    window.addEventListener('resize', handleEntryResize);
    document.getElementById('startBtn').addEventListener('click', () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', handleEntryResize);
    }, { once: true });
})();

const videoElement = document.querySelector('.input_video');
const bgCanvas = document.getElementById('bgCanvas');
const mainCanvas = document.getElementById('mainCanvas');
const bgCtx = bgCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();

let currentHands = [];
let handVelocities = 0;

let currentTheme = 'Rainbow';
const themes = {
    'Rainbow':   (t, index, total) => `hsl(${(t * 100 + index * (360/total)) % 360}, 100%, 60%)`,
    'Cyberpunk': (t, index, total) => (index % 2 === 0) ? '#ff003c' : '#00f0ff',
    'Lava':      (t, index, total) => `hsl(${(10 + (index * 10)) % 40}, 100%, ${50 + Math.sin(t)*10}%)`,
    'Ocean':     (t, index, total) => `hsl(${180 + (index * 20)}, 100%, 60%)`,
    'Galaxy':    (t, index, total) => `hsl(${260 + Math.sin(t*2 + index)*40}, 100%, 65%)`
};

let particles = [];
let ripples = [];
const FINGER_TIPS = [4, 8, 12, 16, 20];

let matrixColumns = [];
const fontSize = 16;
let maxColumns = 0;

let audioCtx = null;
let humOsc = null;
let humGain = null;

const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiGesture = document.getElementById('ui-gesture');
const uiSpread = document.getElementById('ui-spread');

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    bgCanvas.width = width;
    bgCanvas.height = height;
    mainCanvas.width = width;
    mainCanvas.height = height;
    bgCtx.font = fontSize + "px monospace";
    maxColumns = Math.floor(width / fontSize);
    matrixColumns = new Array(maxColumns).fill(1).map(() => Math.random() * height/fontSize);
}
window.addEventListener('resize', resize);
resize();

document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTheme = e.target.getAttribute('data-theme');
        document.documentElement.style.setProperty('--accent', themes[currentTheme](0, 1, 1));
    });
});

let appStarted = false;
document.getElementById('startBtn').addEventListener('click', () => {
    if (appStarted) return;
    appStarted = true;
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('themes').classList.remove('hidden');
    initAudio();
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

function initAudio() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
            audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (!humOsc) {
            humOsc = audioCtx.createOscillator();
            humGain = audioCtx.createGain();
            humOsc.type = 'sine';
            humOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            humGain.gain.setValueAtTime(0, audioCtx.currentTime);
            humOsc.connect(humGain);
            humGain.connect(audioCtx.destination);
            humOsc.start();
        }
    } catch(e) {
        console.warn("Web Audio API initialization failed:", e);
    }
}

function triggerZap() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.onended = () => {
            try {
                osc.disconnect();
                gainNode.disconnect();
            } catch (_) {}
        };
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {
        console.warn("Trigger zap error:", e);
    }
}

function updateHum(activeHands) {
    if (!audioCtx || !humGain || !humOsc) return;
    if (audioCtx.state === 'suspended') return;
    if (activeHands.length < 2 || !activeHands[0][8] || !activeHands[1][8]) {
        humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        return;
    }
    const p1 = activeHands[0][8];
    const p2 = activeHands[1][8];
    const dx = p1.x - p2.x;
    const dy = p1.y - p2.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const targetFreq = 100 + (1 - Math.min(dist, 1)) * 300;
    const targetVolume = 0.05 + (1 - Math.min(dist, 1)) * 0.15;
    humOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
    humGain.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.1);
}

function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function mapToCanvas(point) {
    return { x: point.x * width, y: point.y * height };
}

let lastPinchState = [false, false];

const HAND_CONNECTIONS_DEFAULT = [
    [0, 1], [1, 2], [2, 3], [3, 4],
    [0, 5], [5, 6], [6, 7], [7, 8],
    [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16],
    [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
];

function drawHandBones(context, landmarks, color) {
    if (typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined') {
        drawConnectors(context, landmarks, HAND_CONNECTIONS, { color: color, lineWidth: 2 });
        return;
    }
    const connections = (typeof HAND_CONNECTIONS !== 'undefined') ? HAND_CONNECTIONS : HAND_CONNECTIONS_DEFAULT;
    context.strokeStyle = color;
    context.lineWidth = 2;
    for (let i = 0; i < connections.length; i++) {
        const p1 = landmarks[connections[i][0]];
        const p2 = landmarks[connections[i][1]];
        if (p1 && p2) {
            context.beginPath();
            context.moveTo(p1.x * width, p1.y * height);
            context.lineTo(p2.x * width, p2.y * height);
            context.stroke();
        }
    }
}

function detectGestures() {
    if (!currentHands.length) {
        uiGesture.innerText = "None";
        uiSpread.innerText = "0%";
        lastPinchState = [false, false];
        return;
    }
    
    currentHands.forEach((hand, idx) => {
        if (!hand || !hand[4] || !hand[8]) return;
        const thumb = hand[4];
        const index = hand[8];
        const dist = getDist(thumb, index);
        const isPinching = dist < 0.05;
        
        if (isPinching && !lastPinchState[idx]) {
            const midpoint = {
                x: (thumb.x + index.x) / 2, 
                y: (thumb.y + index.y) / 2
            };
            createShockwave(mapToCanvas(midpoint), themes[currentTheme](time, 1, 1));
            triggerZap();
            uiGesture.innerText = "PINCH !";
        }
        lastPinchState[idx] = isPinching;
    });

    if (currentHands[0] && currentHands[0][8] && currentHands[0][20]) {
        const spread = getDist(currentHands[0][8], currentHands[0][20]);
        let spreadPct = Math.min(Math.round(spread * 300), 100);
        uiSpread.innerText = spreadPct + '%';
        if (!lastPinchState.includes(true)) {
            uiGesture.innerText = spreadPct > 50 ? "Open Hand" : "Fist";
        }
    }
}

function createParticles(pos, color, count = 3) {
    for (let i=0; i<count; i++) {
        particles.push({
            x: pos.x,
            y: pos.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function createShockwave(pos, color) {
    ripples.push({
        x: pos.x,
        y: pos.y,
        radius: 0,
        maxRadius: 150 + Math.random() * 100,
        life: 1.0,
        color: color
    });
}

function drawBackground() {
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = `rgba(0, 0, 0, ${0.15 + Math.min(handVelocities*10, 0.5)})`;
    bgCtx.fillRect(0, 0, width, height);
    bgCtx.globalCompositeOperation = 'source-over';

    bgCtx.fillStyle = themes[currentTheme](time, 1, 1);
    
    let speedMult = 1 + (handVelocities * 100);

    for (let i = 0; i < matrixColumns.length; i++) {
        if (Math.random() > 0.95) {
            const char = String.fromCharCode(0x30A0 + Math.random() * 96);
            bgCtx.fillText(char, i * fontSize, matrixColumns[i] * fontSize);
        }
        matrixColumns[i] += Math.random() * speedMult;
        if (matrixColumns[i] * fontSize > height && Math.random() > 0.9) {
            matrixColumns[i] = 0;
        }
    }
}

function updatePhysics() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.vy += 0.1;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.radius += (r.maxRadius - r.radius) * 0.12 + 1.5;
        r.life -= 0.025;
        if (r.life <= 0) {
            ripples.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(r.x, r.y, Math.max(0, r.radius), 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.lineWidth = Math.max(1, 3 * r.life);
            ctx.globalAlpha = Math.max(0, r.life * 0.85);
            ctx.stroke();
        }
    }
    
    ctx.globalAlpha = 1.0;
}

function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        uiFps.innerText = framesThisSecond;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    drawBackground();

    ctx.clearRect(0, 0, width, height);

    if (particles.length > 100) {
        particles.splice(0, particles.length - 100);
    }
    if (ripples.length > 25) {
        ripples.splice(0, ripples.length - 25);
    }

    ctx.globalCompositeOperation = 'screen';

    updatePhysics();

    if (currentHands.length > 0) {
        
        currentHands.forEach((hand, handIndex) => {
            const glowColor = themes[currentTheme](time, handIndex, 2);
            
            drawHandBones(ctx, hand, glowColor);
            
            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt = mapToCanvas(hand[tipIndex]);
                const tipCol = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                if (Math.random() > 0.8) {
                    createParticles(pt, tipCol, 1);
                }
            });

            const spread = getDist(hand[8], hand[20]);
            if (spread > 0.08) {
                const tips = FINGER_TIPS.map(t => mapToCanvas(hand[t]));
                for (let a = 0; a < tips.length; a++) {
                    for (let b = a + 1; b < tips.length; b++) {
                        ctx.beginPath();
                        ctx.moveTo(tips[a].x, tips[a].y);
                        ctx.lineTo(tips[b].x, tips[b].y);
                        ctx.strokeStyle = themes[currentTheme](time, a + b, 10);
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = 0.6;
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
            }
        });

        if (currentHands.length >= 2) {
            const h1 = currentHands[0];
            const h2 = currentHands[1];

            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt1 = mapToCanvas(h1[tipIndex]);
                const pt2 = mapToCanvas(h2[tipIndex]);
                const col = themes[currentTheme](time, idx, FINGER_TIPS.length);

                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                ctx.strokeStyle = col;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            if (h1 && h2) {
                let allTips = FINGER_TIPS.map(t => mapToCanvas(h1[t])).concat(
                              FINGER_TIPS.map(t => mapToCanvas(h2[t])) );
                
                ctx.save();
                let cx = allTips.reduce((sum, p) => sum + p.x, 0) / 10;
                let cy = allTips.reduce((sum, p) => sum + p.y, 0) / 10;
                
                ctx.translate(cx, cy);
                ctx.rotate(time * 0.5);
                
                ctx.beginPath();
                for (let i=0; i<10; i++) {
                    const t1 = { x: allTips[i].x - cx, y: allTips[i].y - cy };
                    const t2 = { x: allTips[(i+3)%10].x - cx, y: allTips[(i+3)%10].y - cy };
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                }
                ctx.strokeStyle = `rgba(255, 255, 255, 0.2)`;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        }
        
        detectGestures();
    }
    
    ctx.globalCompositeOperation = 'source-over';
}

function showError(msg) {
    const banner = document.getElementById('errorBanner');
    if (banner) {
        banner.textContent = msg;
        banner.classList.remove('hidden');
    }
}

function initMediaPipe() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("Camera API is not supported in this environment. Please run over HTTPS or localhost.");
        return;
    }

    try {
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.4
        });

        hands.onResults((results) => {
            uiHands.innerText = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
            
            let targetVel = 0;
            if (currentHands.length > 0 && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const oldP = currentHands[0][8];
                const newP = results.multiHandLandmarks[0][8];
                if (oldP && newP) {
                    targetVel = getDist(oldP, newP);
                }
            }
            handVelocities += (targetVel - handVelocities) * 0.25;

            currentHands = results.multiHandLandmarks || [];
            if (audioCtx) {
                updateHum(currentHands);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        
        camera.start().catch((err) => {
            console.error("Camera startup failed:", err);
            showError("Unable to access camera. Please allow camera permissions and refresh.");
        });
    } catch (err) {
        console.error("MediaPipe initialization error:", err);
        showError("MediaPipe initialization failed. Please check network connection.");
    }
}

</script>
