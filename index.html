<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandConnect — AR Hand Tracker</title>
    
    <meta name="description" content="HandConnect - Real-time browser-based AR hand tracker with interactive visual and audio effects.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/matrix.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/tracker.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div id="startOverlay">
        <canvas id="entryParticles"></canvas>
        <div class="overlay-content">
            <div class="overlay-icon">🖐️</div>
            <h1 class="overlay-title">HANDCONNECT</h1>
            <p class="overlay-tagline">Your hands are the controller. The world is your canvas.</p>
            <div class="overlay-features">
                <span class="feature-pill">🕸️ String Web</span>
                <span class="feature-pill">🎨 5 Themes</span>
                <span class="feature-pill">🔊 Reactive Audio</span>
                <span class="feature-pill">🎆 Particles</span>
                <span class="feature-pill">🟢 Matrix Rain</span>
            </div>
            <button class="start-btn" id="startBtn">Enter Experience</button>
            <p class="overlay-hint">Requires camera access · Works best in Chrome</p>
        </div>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Spread: <span class="val" id="ui-spread">0%</span></div>
        </div>
    </div>

    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">Rainbow</button>
        <button class="theme-btn" data-theme="Cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="Lava">Lava</button>
        <button class="theme-btn" data-theme="Ocean">Ocean</button>
        <button class="theme-btn" data-theme="Galaxy">Galaxy</button>
    </div>

<script>
(function initEntryParticles() {
    const epc = document.getElementById('entryParticles');
    const ectx = epc.getContext('2d');
    let ew = epc.width = window.innerWidth;
    let eh = epc.height = window.innerHeight;
    const dots = [];
    let animId;
    for (let i = 0; i < 60; i++) {
        dots.push({
            x: Math.random() * ew,
            y: Math.random() * eh,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            r: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.4 + 0.1
        });
    }
    function drawEntry() {
        ectx.clearRect(0, 0, ew, eh);
        dots.forEach(d => {
            d.x += d.vx;
            d.y += d.vy;
            if (d.x < 0) d.x = ew;
            if (d.x > ew) d.x = 0;
            if (d.y < 0) d.y = eh;
            if (d.y > eh) d.y = 0;
            ectx.beginPath();
            ectx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ectx.fillStyle = `rgba(255, 255, 255, ${d.a})`;
            ectx.fill();
        });
        for (let i = 0; i < dots.length; i++) {
            for (let j = i + 1; j < dots.length; j++) {
                const dx = dots[i].x - dots[j].x;
                const dy = dots[i].y - dots[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ectx.beginPath();
                    ectx.moveTo(dots[i].x, dots[i].y);
                    ectx.lineTo(dots[j].x, dots[j].y);
                    ectx.strokeStyle = `rgba(255, 255, 255, ${0.06 * (1 - dist / 120)})`;
                    ectx.stroke();
                }
            }
        }
        animId = requestAnimationFrame(drawEntry);
    }
    drawEntry();
    function handleEntryResize() { ew = epc.width = window.innerWidth; eh = epc.height = window.innerHeight; }
    window.addEventListener('resize', handleEntryResize);
    document.getElementById('startBtn').addEventListener('click', () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', handleEntryResize);
    }, { once: true });
})();

const videoElement = document.querySelector('.input_video');
const bgCanvas = document.getElementById('bgCanvas');
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();

let currentHands = [];
let handVelocities = 0;

let currentTheme = 'Rainbow';
const themes = {
    'Rainbow':   (t, index, total) => `hsl(${(t * 100 + index * (360/total)) % 360}, 100%, 60%)`,
    'Cyberpunk': (t, index, total) => (index % 2 === 0) ? '#ff003c' : '#00f0ff',
    'Lava':      (t, index, total) => `hsl(${(10 + (index * 10)) % 40}, 100%, ${50 + Math.sin(t)*10}%)`,
    'Ocean':     (t, index, total) => `hsl(${180 + (index * 20)}, 100%, 60%)`,
    'Galaxy':    (t, index, total) => `hsl(${260 + Math.sin(t*2 + index)*40}, 100%, 65%)`
};

const particleSystem = new ParticleSystem(100, 25);
const matrixRain = new MatrixRain(bgCanvas, 16);
const FINGER_TIPS = [4, 8, 12, 16, 20];

const audioEngine = new AudioEngine();

const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiGesture = document.getElementById('ui-gesture');
const uiSpread = document.getElementById('ui-spread');

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    mainCanvas.width = width;
    mainCanvas.height = height;
    matrixRain.resize(width, height);
}
window.addEventListener('resize', resize);
resize();

document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTheme = e.target.getAttribute('data-theme');
        document.documentElement.style.setProperty('--accent', themes[currentTheme](0, 1, 1));
    });
});

let appStarted = false;
document.getElementById('startBtn').addEventListener('click', () => {
    if (appStarted) return;
    appStarted = true;
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('themes').classList.remove('hidden');
    audioEngine.init();
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

const gestureDetector = new GestureDetector();

function updateGestures() {
    const res = gestureDetector.detect(currentHands);
    uiGesture.innerText = res.gesture;
    uiSpread.innerText = res.spreadPct + '%';
    if (res.newPinch && res.midpoint) {
        particleSystem.emitShockwave(mapToCanvas(res.midpoint, width, height), themes[currentTheme](time, 1, 1));
        audioEngine.triggerZap();
    }
}

function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        uiFps.innerText = framesThisSecond;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    matrixRain.render(themes[currentTheme](time, 1, 1), handVelocities);

    ctx.clearRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'screen';

    particleSystem.updateAndRender(ctx);

    if (currentHands.length > 0) {
        
        currentHands.forEach((hand, handIndex) => {
            const glowColor = themes[currentTheme](time, handIndex, 2);
            
            drawHandBones(ctx, hand, glowColor, width, height);
            
            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt = mapToCanvas(hand[tipIndex], width, height);
                const tipCol = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                if (Math.random() > 0.8) {
                    particleSystem.emit(pt, tipCol, 1);
                }
            });

            const spread = getDist(hand[8], hand[20]);
            if (spread > 0.08) {
                const tips = FINGER_TIPS.map(t => mapToCanvas(hand[t], width, height));
                for (let a = 0; a < tips.length; a++) {
                    for (let b = a + 1; b < tips.length; b++) {
                        ctx.beginPath();
                        ctx.moveTo(tips[a].x, tips[a].y);
                        ctx.lineTo(tips[b].x, tips[b].y);
                        ctx.strokeStyle = themes[currentTheme](time, a + b, 10);
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = 0.6;
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
            }
        });

        if (currentHands.length >= 2) {
            const h1 = currentHands[0];
            const h2 = currentHands[1];

            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt1 = mapToCanvas(h1[tipIndex], width, height);
                const pt2 = mapToCanvas(h2[tipIndex], width, height);
                const col = themes[currentTheme](time, idx, FINGER_TIPS.length);

                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                ctx.strokeStyle = col;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.7;
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            if (h1 && h2) {
                let allTips = FINGER_TIPS.map(t => mapToCanvas(h1[t], width, height)).concat(
                              FINGER_TIPS.map(t => mapToCanvas(h2[t], width, height)) );
                
                ctx.save();
                let cx = allTips.reduce((sum, p) => sum + p.x, 0) / 10;
                let cy = allTips.reduce((sum, p) => sum + p.y, 0) / 10;
                
                ctx.translate(cx, cy);
                ctx.rotate(time * 0.5);
                
                ctx.beginPath();
                for (let i=0; i<10; i++) {
                    const t1 = { x: allTips[i].x - cx, y: allTips[i].y - cy };
                    const t2 = { x: allTips[(i+3)%10].x - cx, y: allTips[(i+3)%10].y - cy };
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                }
                ctx.strokeStyle = `rgba(255, 255, 255, 0.2)`;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        }
    }
    
    updateGestures();
    
    ctx.globalCompositeOperation = 'source-over';
}

function showError(msg) {
    const banner = document.getElementById('errorBanner');
    if (banner) {
        banner.textContent = msg;
        banner.classList.remove('hidden');
    }
}

function initMediaPipe() {
    const tracker = new HandTracker(videoElement, {
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.4
    }, {
        onResults: (results) => {
            uiHands.innerText = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
            
            let targetVel = 0;
            if (currentHands.length > 0 && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const oldP = currentHands[0][8];
                const newP = results.multiHandLandmarks[0][8];
                if (oldP && newP) {
                    targetVel = getDist(oldP, newP);
                }
            }
            handVelocities += (targetVel - handVelocities) * 0.25;

            currentHands = results.multiHandLandmarks || [];
            audioEngine.updateHum(currentHands);
        },
        onError: (err) => {
            console.error("Tracker error:", err);
            showError(err.message || "Failed to start camera or tracking.");
        }
    });

    tracker.start();
}

</script>
</body>
</html>
