<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f28"/>
      <stop offset="60%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#020205"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="562" fill="url(#spaceGrad)"/>

  <!-- Matrix rain columns -->
  <g fill="#00ffcc" opacity="0.18" font-family="monospace" font-size="14">
    <text x="50" y="80">ｱ</text><text x="50" y="105">ｶ</text><text x="50" y="130">ｻ</text>
    <text x="120" y="140">ﾅ</text><text x="120" y="165">ﾊ</text>
    <text x="240" y="90">ﾔ</text><text x="240" y="115">ﾗ</text>
    <text x="400" y="60">0</text><text x="400" y="85">1</text>
    <text x="600" y="75">X</text><text x="600" y="100">Y</text>
    <text x="820" y="120">ｹ</text><text x="820" y="145">ｺ</text>
    <text x="920" y="90">1</text><text x="920" y="115">0</text>
  </g>

  <!-- HUD overlay (top left) -->
  <g transform="translate(30, 25)">
    <rect width="200" height="65" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Hands Detected:</text>
    <text x="180" y="28" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">2</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">FPS:</text>
    <text x="180" y="48" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">60</text>
  </g>

  <g transform="translate(30, 100)">
    <rect width="200" height="65" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Gesture:</text>
    <text x="180" y="28" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">Peace</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Fret Chord:</text>
    <text x="180" y="48" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">G Major</text>
  </g>

  <!-- Controls overlay (top right) -->
  <g transform="translate(630, 25)">
    <!-- Mode Switcher -->
    <rect width="340" height="36" rx="18" fill="rgba(20, 25, 40, 0.75)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="5" y="4" width="55" height="28" rx="14" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">All</text>
    <rect x="65" y="4" width="65" height="28" rx="14" fill="rgba(0, 255, 204, 0.25)" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="97" y="22" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Guitar</text>
    <text x="162" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Web</text>
    <text x="228" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Orbs</text>
    <text x="295" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Trails</text>

    <!-- Action Buttons -->
    <g transform="translate(85, 46)">
      <rect width="255" height="34" rx="17" fill="rgba(20, 25, 40, 0.75)" stroke="rgba(255,255,255,0.15)"/>
      <rect x="6" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="43" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Spawn Orb</text>
      <rect x="88" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="125" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Snapshot</text>
      <rect x="170" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="207" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Mute</text>
    </g>
  </g>

  <!-- Finger Strings Mode: Hands as Acoustic Guitar Strings (Zero Screen-Spanning Strings) -->
  <!-- Left Hand: 5 Fingers Functioning Directly as 6 Acoustic Strings -->
  <g id="fingerStrings">
    <!-- String 0: Thumb (E2 - 82.4 Hz) -->
    <path d="M 280 430 Q 225 330 185 240" fill="none" stroke="#00ffcc" stroke-width="4.2" filter="url(#laserGlow)"/>
    <rect x="155" y="222" width="38" height="18" rx="4" fill="rgba(0, 255, 204, 0.25)" stroke="#00ffcc" stroke-width="1"/>
    <text x="174" y="235" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">E2</text>

    <!-- String 1: Index (A2 - 110.0 Hz - Vibrating) -->
    <path d="M 280 430 Q 260 310 240 185" fill="none" stroke="#38bdf8" stroke-width="3.6" filter="url(#laserGlow)"/>
    <rect x="222" y="168" width="38" height="18" rx="4" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="1"/>
    <text x="241" y="181" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">A2</text>

    <!-- String 2: Middle (D3 - 146.8 Hz - Standing Wave Resonance) -->
    <path d="M 280 430 Q 300 300 305 170" fill="none" stroke="#ffffff" stroke-width="3.2" filter="url(#laserGlow)"/>
    <!-- Harmonic standing wave aura -->
    <path d="M 280 430 Q 285 300 305 170" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.6"/>
    <rect x="286" y="152" width="38" height="18" rx="4" fill="rgba(168, 85, 247, 0.35)" stroke="#ffffff" stroke-width="1.2"/>
    <text x="305" y="165" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">D3</text>

    <!-- String 3: Ring (G3 - 196.0 Hz) -->
    <path d="M 280 430 Q 330 330 355 210" fill="none" stroke="#ec4899" stroke-width="2.4" filter="url(#laserGlow)"/>
    <rect x="338" y="195" width="38" height="18" rx="4" fill="rgba(236, 72, 153, 0.25)" stroke="#ec4899" stroke-width="1"/>
    <text x="357" y="208" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">G3</text>

    <!-- String 4: Pinky (B3 - 246.9 Hz) -->
    <path d="M 280 430 Q 360 360 395 250" fill="none" stroke="#f59e0b" stroke-width="1.8" filter="url(#laserGlow)"/>
    <rect x="382" y="235" width="38" height="18" rx="4" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1"/>
    <text x="401" y="248" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">B3</text>

    <!-- String 5: Pinky Extension Beam (High E4 - 329.6 Hz) -->
    <path d="M 395 250 L 440 180" fill="none" stroke="#00ffcc" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#laserGlow)"/>
    <rect x="424" y="165" width="38" height="18" rx="4" fill="rgba(0, 255, 204, 0.3)" stroke="#00ffcc" stroke-width="1"/>
    <text x="443" y="178" fill="#00ffcc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">E4</text>

    <!-- Floating Palm Chord HUD -->
    <rect x="220" y="450" width="130" height="26" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#00ffcc" stroke-width="1"/>
    <text x="285" y="467" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Guitar: G Major</text>
  </g>

  <!-- Left Hand (Fretting G Major) -->
  <g filter="url(#laserGlow)" stroke="#00ffcc" stroke-width="2" fill="none">
    <path d="M 280 430 L 250 360 L 220 300 L 200 250"/>
    <path d="M 280 430 L 260 340 L 250 270 L 245 200"/>
    <path d="M 280 430 L 285 330 L 290 260 L 295 190"/>
    <path d="M 280 430 L 310 350 L 325 280 L 335 240"/>
    <path d="M 280 430 L 335 370 L 355 310 L 365 270"/>
  </g>
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="200" cy="250" r="4"/><circle cx="245" cy="200" r="4"/><circle cx="295" cy="190" r="4"/>
    <circle cx="335" cy="240" r="4"/><circle cx="365" cy="270" r="4"/>
  </g>

  <!-- Right Hand (Strumming downward across D3 and High E) -->
  <g filter="url(#laserGlow)" stroke="#ff00cc" stroke-width="2" fill="none">
    <path d="M 680 440 L 695 380 L 710 320 L 720 270"/>
    <path d="M 680 440 L 665 370 L 655 310 L 640 250"/>
    <path d="M 680 440 L 640 370 L 625 315 L 610 260"/>
    <path d="M 680 440 L 615 380 L 600 330 L 590 280"/>
    <path d="M 680 440 L 590 395 L 575 350 L 565 310"/>
  </g>
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="720" cy="270" r="4"/><circle cx="640" cy="250" r="5"/><circle cx="610" cy="260" r="4"/>
    <circle cx="590" cy="280" r="4"/><circle cx="565" cy="310" r="4"/>
  </g>

  <!-- Strum Spark Burst at Intersection -->
  <g fill="#00ffcc" filter="url(#laserGlow)">
    <circle cx="640" cy="336" r="5"/>
    <circle cx="630" cy="328" r="2.5"/><circle cx="652" cy="342" r="2"/>
    <circle cx="648" cy="326" r="3"/><circle cx="634" cy="348" r="2"/>
  </g>

  <!-- Themes Navigation (bottom center) -->
  <g transform="translate(190, 508)">
    <rect width="620" height="40" rx="20" fill="rgba(20, 25, 40, 0.75)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="5" y="4" width="80" height="32" rx="16" fill="rgba(255,255,255,0.18)"/>
    <text x="45" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Rainbow</text>
    <text x="130" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Cyberpunk</text>
    <text x="215" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Lava</text>
    <text x="295" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Ocean</text>
    <text x="375" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Galaxy</text>
    <text x="460" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Synthwave</text>
    <text x="550" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Supernova</text>
  </g>
</svg>
