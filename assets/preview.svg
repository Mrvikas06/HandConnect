<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f28"/>
      <stop offset="60%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#020205"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="562" fill="url(#spaceGrad)"/>

  <!-- Matrix rain columns -->
  <g fill="#00ffcc" opacity="0.22" font-family="monospace" font-size="14">
    <text x="50" y="80">ｱ</text><text x="50" y="105">ｶ</text><text x="50" y="130">ｻ</text><text x="50" y="155">ﾀ</text>
    <text x="120" y="140">ﾅ</text><text x="120" y="165">ﾊ</text><text x="120" y="190">ﾏ</text>
    <text x="240" y="90">ﾔ</text><text x="240" y="115">ﾗ</text><text x="240" y="140">ﾜ</text>
    <text x="400" y="60">0</text><text x="400" y="85">1</text><text x="400" y="110">0</text><text x="400" y="135">1</text>
    <text x="600" y="75">X</text><text x="600" y="100">Y</text><text x="600" y="125">Z</text>
    <text x="820" y="120">ｹ</text><text x="820" y="145">ｺ</text><text x="820" y="170">ｻ</text>
    <text x="920" y="90">1</text><text x="920" y="115">0</text><text x="920" y="140">1</text>
  </g>

  <!-- HUD overlay (top left) -->
  <g transform="translate(30, 25)">
    <rect width="200" height="65" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Hands Detected:</text>
    <text x="180" y="28" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">2</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">FPS:</text>
    <text x="180" y="48" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">60</text>
  </g>

  <g transform="translate(30, 100)">
    <rect width="200" height="65" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Gesture:</text>
    <text x="180" y="28" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">Pointing</text>
    <text x="16" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Spread:</text>
    <text x="180" y="48" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">88%</text>
  </g>

  <!-- Controls overlay (top right) -->
  <g transform="translate(680, 25)">
    <!-- Mode Switcher -->
    <rect width="290" height="36" rx="18" fill="rgba(20, 25, 40, 0.7)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="5" y="4" width="70" height="28" rx="14" fill="rgba(0, 255, 204, 0.25)" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="40" y="22" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">All</text>
    <text x="108" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Web</text>
    <text x="175" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Orbs</text>
    <text x="248" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Trails</text>

    <!-- Action Buttons -->
    <g transform="translate(35, 46)">
      <rect width="255" height="34" rx="17" fill="rgba(20, 25, 40, 0.7)" stroke="rgba(255,255,255,0.15)"/>
      <rect x="6" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="43" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Spawn Orb</text>
      <rect x="88" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="125" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Snapshot</text>
      <rect x="170" y="4" width="75" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
      <text x="207" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Mute</text>
    </g>
  </g>

  <!-- Ribbon Light Trail curve -->
  <path d="M 220 380 Q 260 260 315 180 T 370 140" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.75" stroke-linecap="round"/>
  <path d="M 685 180 Q 640 220 590 280 T 520 340" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.75" stroke-linecap="round"/>

  <!-- Left Hand Skeleton & Strings -->
  <g filter="url(#laserGlow)" stroke="#00ffcc" stroke-width="2" fill="none">
    <path d="M 360 420 L 320 350 L 290 280 L 270 230"/>
    <path d="M 360 420 L 340 330 L 325 250 L 315 180"/>
    <path d="M 360 420 L 365 320 L 370 240 L 370 170"/>
    <path d="M 360 420 L 390 330 L 410 250 L 420 190"/>
    <path d="M 360 420 L 415 350 L 445 280 L 465 230"/>
    
    <path d="M 270 230 L 315 180 L 370 170 L 420 190 L 465 230 Z" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Pointing Laser Beam from Index (315, 180) -->
  <line x1="315" y1="180" x2="160" y2="70" stroke="#00ffcc" stroke-width="3" filter="url(#laserGlow)"/>
  <circle cx="160" cy="70" r="6" fill="#ffffff" filter="url(#laserGlow)"/>

  <!-- Left Hand Fingertips -->
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="270" cy="230" r="4"/><circle cx="315" cy="180" r="4"/><circle cx="370" cy="170" r="4"/>
    <circle cx="420" cy="190" r="4"/><circle cx="465" cy="230" r="4"/>
  </g>

  <!-- Right Hand Skeleton -->
  <g filter="url(#laserGlow)" stroke="#ff00cc" stroke-width="2" fill="none">
    <path d="M 640 420 L 680 350 L 710 280 L 730 230"/>
    <path d="M 640 420 L 660 330 L 675 250 L 685 180"/>
    <path d="M 640 420 L 635 320 L 630 240 L 630 170"/>
    <path d="M 640 420 L 610 330 L 590 250 L 580 190"/>
    <path d="M 640 420 L 585 350 L 555 280 L 535 230"/>
    <path d="M 730 230 L 685 180 L 630 170 L 580 190 L 535 230 Z" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Right Hand Fingertips -->
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="730" cy="230" r="4"/><circle cx="685" cy="180" r="4"/><circle cx="630" cy="170" r="4"/>
    <circle cx="580" cy="190" r="4"/><circle cx="535" cy="230" r="4"/>
  </g>

  <!-- Cross-Hand Interlinks -->
  <g stroke="url(#glowLine)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="6 3">
    <line x1="270" y1="230" x2="730" y2="230"/>
    <line x1="315" y1="180" x2="685" y2="180"/>
    <line x1="370" y1="170" x2="630" y2="170"/>
  </g>

  <!-- Interactive Physics Orbs with glowing tails -->
  <g filter="url(#laserGlow)">
    <!-- Orb 1 -->
    <circle cx="500" cy="160" r="16" fill="#00ffcc" opacity="0.9"/>
    <circle cx="496" cy="155" r="5" fill="#ffffff"/>
    <circle cx="500" cy="185" r="12" fill="#00ffcc" opacity="0.4"/>
    <!-- Orb 2 -->
    <circle cx="610" cy="110" r="18" fill="#f59e0b" opacity="0.9"/>
    <circle cx="605" cy="105" r="6" fill="#ffffff"/>
    <circle cx="622" cy="130" r="12" fill="#f59e0b" opacity="0.35"/>
  </g>

  <!-- Pinch Shockwave -->
  <circle cx="500" cy="200" r="50" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="500" cy="200" r="100" fill="none" stroke="#ff00cc" stroke-width="1.5" opacity="0.3"/>

  <!-- Themes Navigation (bottom center) -->
  <g transform="translate(190, 502)">
    <rect width="620" height="42" rx="21" fill="rgba(20, 25, 40, 0.7)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="5" y="5" width="80" height="32" rx="16" fill="rgba(255,255,255,0.18)"/>
    <text x="45" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Rainbow</text>
    <text x="130" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Cyberpunk</text>
    <text x="215" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Lava</text>
    <text x="295" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Ocean</text>
    <text x="375" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Galaxy</text>
    <text x="460" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Synthwave</text>
    <text x="550" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Supernova</text>
  </g>
</svg>
