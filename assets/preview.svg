<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f28"/>
      <stop offset="60%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#020205"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="562" fill="url(#spaceGrad)"/>

  <!-- Matrix rain columns -->
  <g fill="#00ffcc" opacity="0.25" font-family="monospace" font-size="14">
    <text x="50" y="80">ｱ</text><text x="50" y="105">ｶ</text><text x="50" y="130">ｻ</text><text x="50" y="155">ﾀ</text>
    <text x="120" y="140">ﾅ</text><text x="120" y="165">ﾊ</text><text x="120" y="190">ﾏ</text>
    <text x="240" y="90">ﾔ</text><text x="240" y="115">ﾗ</text><text x="240" y="140">ﾜ</text>
    <text x="400" y="60">0</text><text x="400" y="85">1</text><text x="400" y="110">0</text><text x="400" y="135">1</text>
    <text x="600" y="75">X</text><text x="600" y="100">Y</text><text x="600" y="125">Z</text>
    <text x="820" y="120">ｹ</text><text x="820" y="145">ｺ</text><text x="820" y="170">ｻ</text>
    <text x="920" y="90">1</text><text x="920" y="115">0</text><text x="920" y="140">1</text>
  </g>

  <!-- HUD overlay (top left) -->
  <g transform="translate(30, 30)">
    <rect width="210" height="70" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Hands Detected:</text>
    <text x="190" y="30" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">2</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">FPS:</text>
    <text x="190" y="52" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">60</text>
  </g>

  <g transform="translate(30, 115)">
    <rect width="210" height="70" rx="10" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Gesture:</text>
    <text x="190" y="30" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">Open Hand</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Spread:</text>
    <text x="190" y="52" fill="#00ffcc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">84%</text>
  </g>

  <!-- Left Hand Skeleton & Strings -->
  <g filter="url(#laserGlow)" stroke="#00ffcc" stroke-width="2" fill="none">
    <!-- Bones -->
    <path d="M 360 420 L 320 350 L 290 280 L 270 230"/> <!-- Thumb -->
    <path d="M 360 420 L 340 330 L 325 250 L 315 180"/> <!-- Index -->
    <path d="M 360 420 L 365 320 L 370 240 L 370 170"/> <!-- Middle -->
    <path d="M 360 420 L 390 330 L 410 250 L 420 190"/> <!-- Ring -->
    <path d="M 360 420 L 415 350 L 445 280 L 465 230"/> <!-- Pinky -->
    
    <!-- String Web connecting fingertips -->
    <path d="M 270 230 L 315 180 L 370 170 L 420 190 L 465 230 Z" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 270 230 L 370 170 L 465 230 L 315 180 L 420 190 Z" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Left Hand Fingertips -->
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="270" cy="230" r="4"/><circle cx="315" cy="180" r="4"/><circle cx="370" cy="170" r="4"/>
    <circle cx="420" cy="190" r="4"/><circle cx="465" cy="230" r="4"/>
  </g>

  <!-- Right Hand Skeleton & Strings -->
  <g filter="url(#laserGlow)" stroke="#ff00cc" stroke-width="2" fill="none">
    <!-- Bones -->
    <path d="M 640 420 L 680 350 L 710 280 L 730 230"/> <!-- Thumb -->
    <path d="M 640 420 L 660 330 L 675 250 L 685 180"/> <!-- Index -->
    <path d="M 640 420 L 635 320 L 630 240 L 630 170"/> <!-- Middle -->
    <path d="M 640 420 L 610 330 L 590 250 L 580 190"/> <!-- Ring -->
    <path d="M 640 420 L 585 350 L 555 280 L 535 230"/> <!-- Pinky -->
    
    <!-- String Web connecting fingertips -->
    <path d="M 730 230 L 685 180 L 630 170 L 580 190 L 535 230 Z" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 730 230 L 630 170 L 535 230 L 685 180 L 580 190 Z" stroke="#fb7185" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Right Hand Fingertips -->
  <g fill="#ffffff" filter="url(#laserGlow)">
    <circle cx="730" cy="230" r="4"/><circle cx="685" cy="180" r="4"/><circle cx="630" cy="170" r="4"/>
    <circle cx="580" cy="190" r="4"/><circle cx="535" cy="230" r="4"/>
  </g>

  <!-- Cross-Hand Interlinks -->
  <g stroke="url(#glowLine)" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="6 3">
    <line x1="270" y1="230" x2="730" y2="230"/>
    <line x1="315" y1="180" x2="685" y2="180"/>
    <line x1="370" y1="170" x2="630" y2="170"/>
    <line x1="420" y1="190" x2="580" y2="190"/>
    <line x1="465" y1="230" x2="535" y2="230"/>
  </g>

  <!-- Pinch Shockwave Waveform -->
  <circle cx="500" cy="205" r="45" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="500" cy="205" r="90" fill="none" stroke="#ff00cc" stroke-width="1.5" opacity="0.3"/>

  <!-- Themes Navigation (bottom center) -->
  <g transform="translate(280, 500)">
    <rect width="440" height="42" rx="21" fill="rgba(20, 25, 40, 0.65)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="6" y="5" width="80" height="32" rx="16" fill="rgba(255,255,255,0.18)"/>
    <text x="46" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rainbow</text>
    <text x="135" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Cyberpunk</text>
    <text x="220" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Lava</text>
    <text x="300" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Ocean</text>
    <text x="385" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Galaxy</text>
  </g>
</svg>
