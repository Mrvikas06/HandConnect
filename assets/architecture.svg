<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bg)" rx="12"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="560" y1="0" x2="560" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="880" y1="0" x2="880" y2="480"/>
  </g>

  <!-- Title -->
  <text x="480" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1.5">HANDCONNECT SYSTEM ARCHITECTURE</text>
  <text x="480" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Modular Client-Side Pipeline: Vision, Physics, Audio &amp; Dual-Canvas Renderer</text>

  <!-- Stage 1: Camera Input -->
  <g transform="translate(60, 130)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="40" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">VIDEO STREAM</text>
    <text x="90" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Webcam Video Feed</text>
    <text x="90" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">getUserMedia @ 720p</text>
    <text x="90" y="102" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Camera Utilities</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 190 L 290 190" stroke="#00ffcc" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Stage 2: MediaPipe Hands -->
  <g transform="translate(290, 130)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#00ffcc" stroke-width="1.5"/>
    <text x="90" y="40" fill="#00ffcc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">HAND TRACKER</text>
    <text x="90" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">MediaPipe Hands ML</text>
    <text x="90" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">21 Landmarks / Hand</text>
    <text x="90" y="102" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Tracking &amp; Velocity</text>
  </g>

  <!-- Arrow 2 -> 3 (Branching) -->
  <path d="M 470 170 L 520 170" stroke="#00ffcc" stroke-width="2"/>
  <path d="M 470 210 L 520 210" stroke="#f43f5e" stroke-width="2"/>

  <!-- Stage 3a: Gestures & Physics -->
  <g transform="translate(520, 100)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="35" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GESTURE &amp; PHYSICS</text>
    <text x="90" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Pinch, Fist, Open Hand</text>
    <text x="90" y="78" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Particle System Engine</text>
    <text x="90" y="95" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Shockwave Propagation</text>
  </g>

  <!-- Stage 3b: Audio Engine -->
  <g transform="translate(520, 230)">
    <rect width="180" height="90" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="90" y="32" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">AUDIO ENGINE</text>
    <text x="90" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Web Audio Synthesizer</text>
    <text x="90" y="70" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Proximity Hum &amp; Pinch Zap</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 700 155 L 740 155 L 740 200 L 760 200" stroke="#00ffcc" stroke-width="2"/>

  <!-- Stage 4: Render Engine -->
  <g transform="translate(750, 130)">
    <rect width="160" height="180" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="35" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DUAL CANVASES</text>
    <line x1="20" y1="48" x2="140" y2="48" stroke="rgba(255,255,255,0.1)"/>
    <text x="80" y="72" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Background Layer</text>
    <text x="80" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Matrix Digital Rain</text>
    <line x1="20" y1="102" x2="140" y2="102" stroke="rgba(255,255,255,0.1)"/>
    <text x="80" y="124" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Foreground Layer</text>
    <text x="80" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Hand Web &amp; Skeleton</text>
    <text x="80" y="158" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Particles &amp; Mandala</text>
  </g>

  <!-- Footer Metrics -->
  <g transform="translate(60, 390)">
    <rect width="840" height="50" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="140" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Zero External Bundlers</text>
    <text x="350" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Native Vanilla ES6 Architecture</text>
    <text x="580" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Dual-Layer 60 FPS Canvas Pipeline</text>
    <text x="760" y="30" fill="#00ffcc" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Local-First AR</text>
  </g>
</svg>
