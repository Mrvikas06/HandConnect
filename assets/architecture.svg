<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
  </defs>

  <rect width="960" height="490" fill="url(#bg)" rx="12"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="490"/>
    <line x1="240" y1="0" x2="240" y2="490"/>
    <line x1="400" y1="0" x2="400" y2="490"/>
    <line x1="560" y1="0" x2="560" y2="490"/>
    <line x1="720" y1="0" x2="720" y2="490"/>
    <line x1="880" y1="0" x2="880" y2="490"/>
  </g>

  <!-- Title -->
  <text x="480" y="50" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1.5">HANDCONNECT SYSTEM ARCHITECTURE</text>
  <text x="480" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Vision, Multi-Gesture AI, Physics Orbs, Air Harp Synth &amp; Dual-Canvas Engine</text>

  <!-- Stage 1: Camera Input -->
  <g transform="translate(50, 115)">
    <rect width="170" height="130" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="38" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">VIDEO STREAM</text>
    <text x="85" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Webcam Video Feed</text>
    <text x="85" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">getUserMedia @ 720p</text>
    <text x="85" y="100" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Camera Utilities</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 180 L 265 180" stroke="#00ffcc" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Stage 2: MediaPipe Hands -->
  <g transform="translate(265, 115)">
    <rect width="180" height="130" rx="10" fill="url(#cardGrad)" stroke="#00ffcc" stroke-width="1.5"/>
    <text x="90" y="38" fill="#00ffcc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">HAND TRACKER</text>
    <text x="90" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">MediaPipe Hands ML</text>
    <text x="90" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">21 Landmarks / Hand</text>
    <text x="90" y="100" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Velocity &amp; Finger States</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 445 160 L 490 145" stroke="#a855f7" stroke-width="2"/>
  <path d="M 445 180 L 490 200" stroke="#f43f5e" stroke-width="2"/>
  <path d="M 445 200 L 490 260" stroke="#f59e0b" stroke-width="2"/>

  <!-- Stage 3a: Gestures & Recognition -->
  <g transform="translate(490, 95)">
    <rect width="195" height="95" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="97" y="28" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">GESTURE DETECTOR</text>
    <text x="97" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Pinch, Clap, Peace Sign</text>
    <text x="97" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Finger Gun &amp; Thumbs Up</text>
    <text x="97" y="83" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Raycast &amp; Spread Vectors</text>
  </g>

  <!-- Stage 3b: Audio Engine -->
  <g transform="translate(490, 200)">
    <rect width="195" height="90" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="97" y="28" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">AIR HARP SYNTH</text>
    <text x="97" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Pentatonic Musical Harp</text>
    <text x="97" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Proximity Hum &amp; Clap Boom</text>
  </g>

  <!-- Stage 3c: Physics Orbs & Ribbons -->
  <g transform="translate(490, 300)">
    <rect width="195" height="85" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="97" y="26" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PHYSICS &amp; TRAILS</text>
    <text x="97" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Bouncing Hand Energy Orbs</text>
    <text x="97" y="64" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Neon Ribbon Light Trails</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 685 145 L 725 180" stroke="#00ffcc" stroke-width="2"/>
  <path d="M 685 245 L 725 210" stroke="#00ffcc" stroke-width="2"/>
  <path d="M 685 340 L 725 250" stroke="#00ffcc" stroke-width="2"/>

  <!-- Stage 4: Render Engine -->
  <g transform="translate(730, 115)">
    <rect width="180" height="250" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DUAL CANVASES</text>
    <line x1="20" y1="44" x2="160" y2="44" stroke="rgba(255,255,255,0.1)"/>
    <text x="90" y="64" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Matrix Rain Canvas</text>
    <text x="90" y="80" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Velocity Acceleration</text>
    <line x1="20" y1="92" x2="160" y2="92" stroke="rgba(255,255,255,0.1)"/>
    <text x="90" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Main AR Canvas</text>
    <text x="90" y="128" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Fingertip String Lattice</text>
    <text x="90" y="144" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Interactive Physics Orbs</text>
    <text x="90" y="160" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Ribbon Light Trails</text>
    <text x="90" y="176" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Radial Shockwaves</text>
    <line x1="20" y1="188" x2="160" y2="188" stroke="rgba(255,255,255,0.1)"/>
    <text x="90" y="208" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Snapshot Compositor</text>
    <text x="90" y="226" fill="#00ffcc" font-family="sans-serif" font-size="9" text-anchor="middle">High-Res PNG Export</text>
  </g>

  <!-- Footer Metrics -->
  <g transform="translate(50, 410)">
    <rect width="860" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="140" y="29" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">7 Dynamic Themes</text>
    <text x="360" y="29" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">4 Visual Modes (Web, Orbs, Trails, All)</text>
    <text x="600" y="29" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Zero External Dependencies</text>
    <text x="790" y="29" fill="#00ffcc" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">60 FPS Hardware AR</text>
  </g>
</svg>
